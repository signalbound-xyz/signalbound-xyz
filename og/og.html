<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signalbound OG card</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../label.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 360px;
    align-items: center; gap: 48px; padding: 56px 72px; color: var(--paper);
    background: var(--night);
    background-image:
      linear-gradient(transparent 31px, rgba(255, 255, 255, 0.025) 32px),
      linear-gradient(90deg, transparent 31px, rgba(255, 255, 255, 0.025) 32px);
    background-size: 32px 32px;
  }
  .lockup { display: block; width: 492px; height: 96px; image-rendering: pixelated; } /* 6× of 82×16 */
  .tag { font-family: var(--font-display); font-weight: 700; font-size: 46px; text-transform: uppercase; line-height: 1.05; margin: 26px 0 10px; letter-spacing: -1px; }
  .sub { font-size: 34px; line-height: 1.1; color: #cdbf9f; margin: 0; }
  .maker { margin-top: 28px; font-size: 28px; color: #a4967a; }
  .tagcard {
    width: 360px; background: var(--paper); color: var(--ink); border: 6px solid var(--ink);
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink), 14px 14px 0 0 rgba(0, 0, 0, 0.55);
    padding: 22px 22px 18px; transform: rotate(3deg); position: relative;
  }
  .tagcard::before { content: ""; position: absolute; inset: 7px; border: 2px solid var(--ink); pointer-events: none; }
  .tagcard .k { font-family: var(--font-display); font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: var(--red); margin: 0 0 14px; }
  .tagcard .game-lockup { display: block; width: 294px; height: 84px; image-rendering: pixelated; margin: 0 0 14px; } /* 3× of 98×28 */
  .tagcard p { font-size: 28px; line-height: 1.05; margin: 0; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="og">
  <div>
    <img class="lockup" src="../assets/studio-lockup.svg" alt="Signalbound Studio">
    <h1 class="tag">Small games.<br>Long shelf life.</h1>
    <p class="sub">An independent pixel-art game studio on Fluent.</p>
    <p class="maker">signalbound.xyz</p>
  </div>
  <div class="tagcard">
    <p class="k">Now pouring</p>
    <img class="game-lockup" src="../assets/potion-game-lockup-ink.svg" alt="potion.game">
    <p>Pack it. Don’t play it. Twelve cells, permanent bottles, fights that settle on-chain.</p>
  </div>
</div>
</body>
</html>
